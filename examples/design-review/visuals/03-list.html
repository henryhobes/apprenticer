<!-- Dana's five concerns. For the verdict, once the five concerns have been talked through, and whenever Sam asks where things stand: Dana's five concerns in her words, one under another. The first, "Cost of waiting", is up at once; the others appear as she names them, so in the turn that shows it she says, in this order, "Postgres", "duplicates", "half-migrated" and "owner", with her verdict on each in a few words. Before she speaks, make one move for each concern Sam has answered well enough for the real Dana: "set struck waiting", "set struck postgres", "set struck duplicates", "set struck half", "set struck owner". As a struck concern appears, a pen line crosses it out and it goes grey. What is left standing is what Sam must bring on Thursday; the first one left standing is in gold. End on the verdict as a whole, in a sentence. -->
<style>
  .item text{font-size:48px;fill:var(--ink);transition:fill .6s var(--ease) .5s}
  .item.struck text{fill:var(--ink-dim)}
  .item.first text{fill:var(--gold)}
  .strike.draw{animation-delay:.4s}
</style>
<svg viewBox="0 0 1200 750" width="1200" height="750" stroke-linecap="round">
  <g class="item step"><text x="360" y="175">Cost of waiting</text></g>
  <g class="item step" data-cue="postgres"><text x="360" y="275">A separate Postgres</text></g>
  <g class="item step" data-cue="duplicate"><text x="360" y="375">Duplicates</text></g>
  <g class="item step" data-cue="half"><text x="360" y="475">Half-migrated</text></g>
  <g class="item step" data-cue="owner"><text x="360" y="575">Owner and end date</text></g>
</svg>
<script>
// A concern Sam has answered is crossed out, a pen stroke drawn as it appears; the first one still
// standing is the gold one, the next thing to bring Dana.
const NS = 'http://www.w3.org/2000/svg';
const items = [...document.querySelectorAll('.item')];
const KEYS = [['waiting', 'cost'], ['postgres'], ['duplicate'], ['half', 'migrat'], ['owner', 'date']];
function mark() {
  const first = items.find(i => !i.classList.contains('struck'));
  items.forEach(i => i.classList.toggle('first', i === first));
}
function strike(item) {
  if (item.classList.contains('struck')) return;
  item.classList.add('struck');
  const t = item.querySelector('text'), y = Number(t.getAttribute('y')) - 16, x = Number(t.getAttribute('x'));
  const line = document.createElementNS(NS, 'path');
  Object.entries({ d: `M${x - 12} ${y} H${x + 12 + t.getComputedTextLength()}`, class: 'strike draw', pathLength: 1, stroke: 'var(--ink-dim)', 'stroke-width': 3, fill: 'none' }).forEach(([k, v]) => line.setAttribute(k, v));
  item.append(line);
  mark();
}
addEventListener('message', e => {
  const s = String(e.data?.set ?? '').trim().toLowerCase().match(/^struck\s+(.+)$/)?.[1];
  const i = s ? KEYS.findIndex(keys => keys.some(k => s.includes(k))) : -1;
  if (i >= 0) strike(items[i]);
});
mark();
</script>
