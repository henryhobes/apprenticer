<!-- Two real OpenAI models on a test of short factual questions. For beat 3. A table with no borders, figures out of every hundred questions, from OpenAI's post on hallucinations (SimpleQA, in the sources). Two columns: "older model" with "o4-mini" in grey under it, and "newer model" with "gpt-5-thinking-mini" in grey under it. Row names down the left in grey. Up at once: the column heads, and the "right" row as you say "right": 24 against 22, the 24 in gold, what an accuracy-only leaderboard sees, so the older model wins. In the turn that shows it, say "right". Then ask how often the older one said "I don't know". "set abstain": the "don't know" row appears: 1 against 52. Make it in the turn after Maya's guess. "set errors": the "wrong" row appears, 75 against 26, and the gold moves from the 24 to the 75: the guesser wins the leaderboard and is wrong three times as often. Make it in the turn after "set abstain", or together with it if time is short; it brings up the "don't know" row too. -->
<style>
  .cell{position:absolute;text-align:center;width:300px}
  .head{font-size:32px;color:var(--ink)}
  .sub{font-size:22px;color:var(--ink-dim)}
  .row{position:absolute;left:100px;font-size:30px;color:var(--ink-dim)}
  .num{position:absolute;width:300px;text-align:center;font-size:64px;color:var(--ink);transition:color .4s var(--ease)}
  .num.hot{color:var(--gold)}
  .rule{position:absolute;left:100px;width:1000px;top:250px;border-top:2px solid var(--faint)}
  .later{opacity:0;transform:translateY(8px);transition:opacity .6s var(--ease),transform .6s var(--ease)}
  .later.in{opacity:1;transform:none}
</style>
<div class="step">
  <div class="cell head" style="left:450px;top:130px">older model</div>
  <div class="cell sub" style="left:450px;top:180px">o4-mini</div>
  <div class="cell head" style="left:800px;top:130px">newer model</div>
  <div class="cell sub" style="left:800px;top:180px">gpt-5-thinking-mini</div>
  <div class="rule"></div>
</div>
<div class="step" data-cue="right">
  <div class="row" style="top:310px">right</div>
  <div class="num hot" id="r1" style="left:450px;top:280px">24</div>
  <div class="num" style="left:800px;top:280px">22</div>
</div>
<div class="later" id="abstain">
  <div class="row" style="top:440px">don't know</div>
  <div class="num" style="left:450px;top:410px">1</div>
  <div class="num" style="left:800px;top:410px">52</div>
</div>
<div class="later" id="errors">
  <div class="row" style="top:570px">wrong</div>
  <div class="num" id="w1" style="left:450px;top:540px">75</div>
  <div class="num" style="left:800px;top:540px">26</div>
</div>
<script>
const $ = id => document.getElementById(id);
addEventListener('message', e => {
  const m = String(e.data?.set ?? '').trim().toLowerCase();
  if (m === 'abstain' || m === 'errors') $('abstain').classList.add('in');
  if (m === 'errors') {
    $('errors').classList.add('in');
    $('r1').classList.remove('hot');
    $('w1').classList.add('hot');
  }
});
</script>
