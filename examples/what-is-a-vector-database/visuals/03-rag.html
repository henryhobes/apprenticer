<!-- The RAG loop: question, the three nearest chunks, the model, the answer. For beats 4 and 5 and the close. Left to right. Up at once: a "question" box on the left, and beside it the meaning map as a panel full of small grey dots, "your docs, chunked" in grey under it. Then, as you say each word: "top three" (the question lands on the map as a point, and its three nearest dots light up inside one ring, one of them labelled "Refund", the "Refund duplicate" article from 02-search); "chat model" (an arrow to a "chat model" box, the separate model that writes); "answer" (an arrow to an "answer" box, in gold). Name all four in one run, in that order, in the turn that shows it (say it word for word: "your question, the top three chunks, the chat model, the answer"), and never say "model" or "answer" before "top three" in that turn, then say what happens: the three chunks are pasted into the model's prompt with the question, and it writes the answer from them; it was never trained on these docs. "set miss": the refund chunk was never stored. Its dot fades, a dashed gold ring marks the empty place, the ring widens to take in the next-nearest dot, which lights instead, and the answer box turns dashed grey and reads "a guess". Make it in the turn after Nadia answers the miss question, and say the model still answers, from the wrong chunks and its training, and sounds just as sure. "set fetch" puts the refund chunk back and the answer back in gold: make it to open beat 5, as you say the article is stored again. In the close, make "set fetch" and "set labels off" together: question, your docs, top three, chat model and answer hide and come back as each is named. Three chunks is a toy choice from the sources, and the dots are props, not a real index. -->
<style>
  .box{fill:var(--panel);stroke:var(--ink);stroke-width:2;transition:stroke .5s var(--ease)}
  .lbl{fill:var(--ink);font-size:30px;transition:fill .5s var(--ease)}
  .sub{fill:var(--ink-dim);font-size:24px}
  .dot{fill:var(--ink-dim);transition:fill .5s var(--ease),opacity .5s var(--ease)}
  .arrow{fill:none;stroke:var(--ink-dim);stroke-width:2}
  .hot{fill:var(--gold)}
  #ans{stroke:var(--gold);stroke-width:3}
  body.miss #ans{stroke:var(--ink-dim);stroke-width:2;stroke-dasharray:10 8}
  body.miss #ansl{fill:var(--ink-dim)}
  body.miss #ref,body.miss #refl{opacity:0}
  body.miss #spare{fill:var(--ink)}
  #gap{opacity:0;transition:opacity .5s var(--ease)}
  body.miss #gap{opacity:1}
</style>
<svg viewBox="0 0 1200 750" width="1200" height="750" stroke-linecap="round" stroke-linejoin="round">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="var(--ink-dim)" stroke-width="1.6"/></marker>
  </defs>
  <g class="step">
    <rect class="box" x="60" y="315" width="170" height="120" rx="6"/>
    <text class="lbl label" data-cue="question" x="145" y="385" text-anchor="middle">question</text>
    <path class="arrow" d="M240 375 H282" marker-end="url(#ah)"/>
    <rect x="290" y="170" width="420" height="410" rx="6" fill="none" stroke="var(--faint)" stroke-width="2"/>
    <g id="dots">
      <circle class="dot" cx="340" cy="220" r="8"/><circle class="dot" cx="420" cy="260" r="8"/>
      <circle class="dot" cx="560" cy="210" r="8"/><circle class="dot" cx="680" cy="240" r="8"/>
      <circle class="dot" cx="650" cy="340" r="8"/><circle class="dot" cx="330" cy="470" r="8"/>
      <circle class="dot" cx="690" cy="520" r="8"/><circle class="dot" cx="600" cy="540" r="8"/>
      <circle class="dot" id="spare" cx="445" cy="525" r="8"/>
      <circle class="dot" id="ref" cx="480" cy="325" r="8"/>
      <circle class="dot" id="c2" cx="410" cy="410" r="8"/>
      <circle class="dot" id="c3" cx="540" cy="430" r="8"/>
    </g>
    <text class="sub label" data-cue="doc|chunk|article" x="500" y="620" text-anchor="middle">your docs, chunked</text>
  </g>
  <g class="step" data-cue="top|three">
    <circle cx="470" cy="400" r="11" fill="var(--ink)"/>
    <circle id="ring" cx="470" cy="400" r="110" fill="none" stroke="var(--ink)" stroke-width="2"/>
    <circle cx="480" cy="325" r="9" fill="var(--ink)" id="refon"/>
    <circle cx="410" cy="410" r="9" fill="var(--ink)"/>
    <circle cx="540" cy="430" r="9" fill="var(--ink)"/>
    <text class="lbl label" id="refl" data-cue="refund" x="480" y="372" text-anchor="middle">Refund</text>
    <text class="lbl label" data-cue="top|three|nearest|closest" x="470" y="155" text-anchor="middle">top three</text>
  </g>
  <g class="step" data-cue="chat">
    <path class="arrow draw" pathLength="1" d="M720 375 H772" marker-end="url(#ah)"/>
    <rect class="box" x="780" y="315" width="190" height="120" rx="6"/>
    <text class="lbl label" data-cue="chat|model" x="875" y="385" text-anchor="middle">chat model</text>
  </g>
  <g class="step" data-cue="answer">
    <path class="arrow draw" pathLength="1" d="M980 375 H1002" marker-end="url(#ah)"/>
    <rect class="box" id="ans" x="1010" y="315" width="130" height="120" rx="6"/>
    <text class="lbl hot label" id="ansl" data-cue="answer|guess" x="1075" y="385" text-anchor="middle">answer</text>
  </g>
  <circle id="gap" cx="480" cy="325" r="18" fill="none" stroke="var(--gold)" stroke-width="3" stroke-dasharray="6 6"/>
</svg>
<script>
const $ = id => document.getElementById(id);
addEventListener('message', e => {
  const m = String(e.data?.set ?? '').trim().toLowerCase();
  if (m === 'miss') { document.body.classList.add('miss'); $('ansl').textContent = 'a guess'; $('refon').style.opacity = 0; $('ring').setAttribute('r', 140); }
  if (m === 'fetch') { document.body.classList.remove('miss'); $('ansl').textContent = 'answer'; $('refon').style.opacity = 1; $('ring').setAttribute('r', 110); }
});
</script>
