<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111214">
<title>Apprenticer</title>
<style>
  :root { --ink: #ECE9E3; --ink-dim: #8A8780; --panel: #1C1D20; --gold: #D9A441; --ease: cubic-bezier(.2,.7,.2,1); }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #111214; color: var(--ink); font: 17px -apple-system, BlinkMacSystemFont, sans-serif; }
  button { font: inherit; color: inherit; border: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; }

  /* The board: a 1200x750 canvas scaled to the screen. No frame: visuals are drawn onto the room. */
  #stage { position: fixed; inset: 0; display: grid; place-items: center; pointer-events: none; }
  #canvas { position: relative; width: 1200px; height: 750px; flex: none; transform: scale(var(--scale, 1)); }
  #canvas iframe { position: absolute; inset: 0; width: 1200px; height: 750px; border: 0; background: transparent; opacity: 0;
    transform-origin: 50% 0; transition: opacity .4s var(--ease), transform .5s var(--ease); }
  #canvas iframe.shown { opacity: 1; pointer-events: auto; } /* some visuals take clicks and typing */
  body.asking #canvas iframe { opacity: .8; transform: scale(.82); } /* the visual makes room for the question, and stays readable */
  /* A question: over a visual, a band rising from the bottom edge; on an empty board, on its own. */
  #question { position: absolute; left: 0; right: 0; bottom: 0; margin: 0; padding: 90px 60px 56px;
    background: linear-gradient(to top, #111214 calc(100% - 80px), rgba(17,18,20,0)); opacity: 0; transform: translateY(8px); transition: opacity .5s var(--ease), transform .5s var(--ease); }
  #question span { display: block; padding: 4px 0 4px 28px; border-left: 3px solid var(--gold); font-size: 40px; font-weight: 300; line-height: 1.25; }
  body.asking #question { opacity: 1; transform: none; }
  body.asking:not(.visual) #question { bottom: auto; top: 38%; background: none; }
  #where { position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%); color: var(--ink-dim); font-size: 14px; opacity: 0; transition: opacity .3s; }
  #where.on { opacity: 1; }
  /* The last new term, above the board, clear of the controls: its spelling and meaning, for a word heard once. */
  #term { position: fixed; left: 50%; top: max(16px, env(safe-area-inset-top)); transform: translateX(-50%); max-width: calc(100% - 32px); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    color: var(--ink-dim); font-size: 18px; opacity: 0; transition: opacity .5s var(--ease); }
  #term.on { opacity: 1; }
  #term b { color: var(--ink); font-weight: 500; margin-right: .5em; }

  /* The disc: the one control. Big and centred before a session; small in the corner once the board is up. */
  #power { position: fixed; left: calc(50% - 80px); top: calc(50% - 80px); width: 160px; height: 160px; border-radius: 50%; background: var(--panel); font-size: 22px;
    transition: all .4s var(--ease); }
  body[data-state=connecting] #power { opacity: .6; }
  body[data-state=on] #power { box-shadow: 0 0 0 1.5px var(--ink-dim); }
  body.board #power, body[data-state=on] #power { left: calc(100% - 80px); top: calc(100% - 80px); width: 52px; height: 52px; font-size: 13px; }
  body[data-state=on].speaking #power { animation: breathe 1.6s ease-in-out infinite; }
  body.board #power, body.board #mute { opacity: .55; } /* the board's one gold element is the drawing's */
  #power:hover, #mute:hover, #mute[aria-pressed=true] { opacity: 1; }
  @keyframes breathe { 50% { transform: scale(1.08); } }
  #dock { position: fixed; right: 92px; bottom: 37px; display: flex; align-items: center; gap: 12px; visibility: hidden; }
  body[data-state=on] #dock { visibility: visible; }
  #mute { padding: 7px 16px; border-radius: 20px; background: var(--panel); color: var(--ink-dim); font-size: 13px; }
  #mute[aria-pressed=true] { background: var(--ink); color: #111214; }
  #cost { color: var(--ink-dim); font-size: 13px; font-variant-numeric: tabular-nums; opacity: .7; }

  /* Idle, above the disc: the space's name and where you left off; after a session, what it covered. Text on the room, no panel. */
  #head { position: fixed; left: 50%; bottom: calc(50% + 108px); transform: translateX(-50%); width: min(520px, calc(100% - 48px)); text-align: center; transition: opacity .4s var(--ease); }
  body:not([data-state=off]) #head { opacity: 0; pointer-events: none; }
  #title { margin: 0; font-size: 20px; font-weight: 500; }
  #last { margin: 8px 0 0; font-size: 15px; line-height: 1.45; color: var(--ink-dim); }
  #last div { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  body[data-recap] #last { display: none; }
  /* While a recap is up the disc steps down, so it has room above and still sits 28px clear of the text. */
  body[data-recap] #head { bottom: calc(50% + 60px); }
  body[data-recap] #power { top: calc(50% - 32px); }
  body[data-recap=saving] #power { opacity: .6; }
  #recap { display: none; margin-top: 10px; text-align: left; font-size: 15px; line-height: 1.4; animation: fade .6s var(--ease) .6s backwards; }
  body[data-recap] #recap { display: block; }
  #recap ul { margin: 0; padding: 0; list-style: none; color: var(--ink-dim); } /* the past is dim; only the open question carries forward */
  #recap li { padding-left: 16px; text-indent: -16px; }
  #recap li::before { content: '–'; display: inline-block; width: 16px; text-indent: 0; color: var(--ink-dim); }
  #recap p { margin: 0; }
  #open { margin-top: 6px !important; }
  #open span { color: var(--ink-dim); margin-right: .4em; }
  #open b { font-weight: 400; }
  #status { margin-top: 10px !important; color: var(--ink-dim); font-size: 13px; text-align: center; }
  body[data-recap=failed] #status { color: var(--ink); font-size: 14px; }
  #path { margin-top: 2px !important; color: var(--ink-dim); font-size: 12px; opacity: .7; text-align: center; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; user-select: all; }
  #status code { user-select: all; }
  #status code, #path { font-family: ui-monospace, Menlo, monospace; }
  body[data-recap=failed] #path { display: none; } /* the command carries it */
  @keyframes fade { from { opacity: 0; } }

  /* One line below the disc: how to begin, or what went wrong; on the board it sits at the bottom edge. */
  #msg { position: fixed; left: 0; right: 0; top: calc(50% + 108px); text-align: center; color: var(--ink-dim); font-size: 14px; }
  #msg.bad { color: #D98A6A; font-size: 15px; }
  body[data-recap] #msg { top: calc(50% + 156px); }
  body[data-state=on] #msg { top: auto; bottom: 28px; }
</style>
</head>
<body data-state="off">
  <div id="stage"><div id="canvas"><p id="question"><span></span></p></div></div>
  <div id="where"></div>
  <div id="term"></div>
  <div id="head">
    <h1 id="title"></h1>
    <p id="last"></p>
    <div id="recap">
      <ul id="covered"></ul>
      <p id="open"><span>Open:</span><b></b></p>
      <p id="status"></p>
      <p id="path"></p>
    </div>
  </div>
  <button id="power">On</button>
  <div id="dock"><span id="cost"></span><button id="mute" aria-pressed="false">Mute</button></div>
  <div id="msg"></div>
  <audio id="remote" autoplay playsinline></audio>

<template id="base"><style>
  :root{--bg:#111214;--ink:#ECE9E3;--ink-dim:#8A8780;--faint:#3A3B40;--panel:#1C1D20;--gold:#D9A441;--power:#D97A3D;--money:#7FB77E;--time:#7A9CC6;--cool:#5FA8B8;--ease:cubic-bezier(.2,.7,.2,1)}
  html,body{margin:0;width:1200px;height:750px;overflow:hidden;background:transparent;color:var(--ink);font:22px/1.3 -apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;font-variant-numeric:tabular-nums}
  svg{display:block;font-family:inherit;overflow:visible}
  .step{opacity:0;transform:translateY(8px);transition:opacity .6s var(--ease),transform .6s var(--ease)}
  .step.on{opacity:1;transform:none}
  .draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw .9s var(--ease) forwards}
  .step:not(.on) .draw{animation:none}
  @keyframes draw{to{stroke-dashoffset:0}}
  .flow{stroke-dasharray:8 10;animation:flow 1.2s linear 6}
  .step:not(.on) .flow{animation:none}
  @keyframes flow{to{stroke-dashoffset:-18}}
  .label{transition:opacity .5s var(--ease)}
  body.labels-off .label:not(.named){opacity:0}
  body.labels-off .label.named{animation:named 1.4s var(--ease)} /* each one he names flashes gold, then settles */
  @keyframes named{0%,30%{fill:var(--gold)}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.draw{stroke-dashoffset:0}}
</style></template>

<script>
// Apprenticer in the browser: one button to start and end a session, one to mute, and the board.
// GPT-Live runs over WebRTC; the server creates the session and runs the mind on its own
// connection, and streams the board for the session that is live.
const $ = id => document.getElementById(id);
let pc, dc, mic, space = {}, startedAt = 0, spent = 0;

function setState(state, label) { document.body.dataset.state = state; $('power').textContent = label; }

const HINT = 'Tap On. It asks for your microphone, then it speaks first.';
function say(text, bad) { $('msg').textContent = text; $('msg').classList.toggle('bad', !!bad); }
const dollars = usd => '$' + (Math.floor(usd * 20) / 20).toFixed(2); // in nickels, so it doesn't visibly tick

async function on() {
  if ($('msg').classList.contains('bad')) say(''); // an old error; the first-run hint stays through the microphone prompt
  setState('connecting', '…');
  $('remote').play().catch(() => {}); // unlock audio inside the tap
  try {
    mic = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true } });
    say('Connecting…');
    pc = new RTCPeerConnection();
    // A session once started with no sound and nothing said why: say so, and what fixed it then.
    pc.ontrack = e => {
      $('remote').srcObject = e.streams[0];
      $('remote').play().catch(err => say(`No sound. Tap Off, then On. (${err.name})`, true));
      setTimeout(() => { if (pc && ($('remote').paused || e.track.muted) && !$('msg').textContent) say('No sound? Tap Off, then On.', true); }, 3000);
      e.track.onunmute = () => { if (!$('remote').paused) say(''); }; // a slow opening, not a fault
    };
    for (const track of mic.getAudioTracks()) pc.addTrack(track, mic);
    dc = pc.createDataChannel('oai-events');
    dc.onmessage = m => { if (JSON.parse(m.data).type === 'session.closed') off(); };
    pc.onconnectionstatechange = () => { if (pc && ['failed', 'closed'].includes(pc.connectionState)) off(); };
    await pc.setLocalDescription(await pc.createOffer());
    await new Promise(resolve => {
      if (pc.iceGatheringState === 'complete') return resolve();
      pc.addEventListener('icegatheringstatechange', () => pc.iceGatheringState === 'complete' && resolve());
      setTimeout(resolve, 3000);
    });
    const res = await fetch('/api/session', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ sdp: pc.localDescription.sdp }),
    });
    if (!res.ok) throw new Error((await res.json().catch(() => ({}))).error || `The server said ${res.status}.`);
    await pc.setRemoteDescription({ type: 'answer', sdp: (await res.json()).sdp });
    setState('on', 'Off');
    say('');
    delete document.body.dataset.recap; // the last session's recap stays until this one is really on
    spent = 0; $('cost').textContent = dollars(0);
    startedAt = Date.now();
    navigator.wakeLock?.request('screen').catch(() => {});
  } catch (err) {
    off();
    say(err.name === 'NotAllowedError' ? 'Microphone blocked. Allow it in the address bar, then tap On.' : err.message, true);
  }
}

function off() {
  if (document.body.dataset.state === 'on') recap();
  try { dc?.readyState === 'open' && dc.send(JSON.stringify({ type: 'session.close' })); } catch {}
  const closing = pc;
  setTimeout(() => closing?.close(), 1000); // let session.close reach the server first
  mic?.getTracks().forEach(t => t.stop());
  pc = dc = mic = null;
  $('mute').setAttribute('aria-pressed', 'false'); $('mute').textContent = 'Mute';
  setState('off', 'On');
}

// After a session: what it covered, once the mind has written its notes (the board stream brings the recap).
function recap(e) {
  const saving = document.body.dataset.recap === 'saving';
  if (!e) { // a session just ended
    $('covered').replaceChildren(); $('open').hidden = true;
    $('status').textContent = 'Saving notes…';
    $('path').textContent = space.dir || '';
    document.body.dataset.recap = 'saving';
    return;
  }
  if (!saving) return; // an old recap replayed to a page that wasn't there
  $('covered').replaceChildren(...(e.covered || []).map(c => Object.assign(document.createElement('li'), { textContent: c })));
  $('open').hidden = !e.open; $('open').lastElementChild.textContent = e.open || '';
  const took = `${Math.max(1, Math.round((Date.now() - startedAt) / 60000))} min · ${dollars(spent)}`;
  if (e.skipped) { delete document.body.dataset.recap; say(`Too short to keep notes · ${took}`); return loadSpace(); } // not a recap: the last-time lines come back
  if (e.failed) $('status').replaceChildren('Notes not saved · run ', Object.assign(document.createElement('code'), { textContent: `npx apprenticer notes ${space.dir}` }));
  else $('status').textContent = `Notes updated · ${took}`;
  document.body.dataset.recap = e.failed ? 'failed' : 'saved';
  if (!e.failed) loadSpace(); // the next "last time" line
}

async function loadSpace() {
  try {
    space = await (await fetch('/api/space')).json();
    $('title').textContent = space.title;
    document.title = space.title;
    const last = space.last;
    $('last').replaceChildren(...[last?.covered?.[0] && `Last time: ${last.covered[0]}`, last?.open && `Open: ${last.open}`].filter(Boolean)
      .map(t => Object.assign(document.createElement('div'), { textContent: t })));
    if (!last && document.body.dataset.state === 'off' && !$('msg').textContent) say(HINT);
    if (last && $('msg').textContent === HINT) say('');
  } catch {}
}

$('power').onclick = () => document.body.dataset.state === 'off' ? on() : off();
$('mute').onclick = () => {
  const muted = $('mute').getAttribute('aria-pressed') !== 'true';
  $('mute').setAttribute('aria-pressed', String(muted));
  $('mute').textContent = muted ? 'Muted' : 'Mute';
  mic?.getAudioTracks().forEach(t => t.enabled = !muted);
};

// The board. Each visual is the mind's HTML in its own frame. Its first .step part is up at once,
// so the board is never blank; the rest appear as the mind names them (their data-cue words), or
// in order 8 s after the one before (counted from when the voice starts talking) if it doesn't, and all of them once it stops. A question
// appears when the voice has finished asking it and goes when it next speaks. ← and → page back through this
// session's visuals.
const board = { history: [], at: -1, frame: null, said: '', lastSaid: 0, question: null };
const fit = () => document.documentElement.style.setProperty('--scale', Math.min((innerWidth - 96) / 1200, (innerHeight - 96) / 750));
addEventListener('resize', fit); fit();
const mark = () => document.body.classList.toggle('board', board.history.length > 0 || !!board.question);

function render(visual, all) {
  const old = board.frame, frame = document.createElement('iframe');
  frame.srcdoc = `<!doctype html><meta charset="utf-8">${$('base').innerHTML}${visual.html}`;
  frame.sets = [];
  frame.onload = () => {
    frame.steps = [...frame.contentDocument.querySelectorAll('.step')];
    reveal(frame, all, all);
    frame.classList.add('shown');
    frame.loaded = true;
    frame.sets.forEach(arg => set(arg, frame)); // what the mind set while it was loading
  };
  board.frame = frame;
  $('canvas').insertBefore(frame, $('question'));
  document.body.classList.add('visual');
  if (old) { old.classList.remove('shown'); setTimeout(() => old.remove(), 400); }
}

// Reveals the frame's steps up to the last one whose cue has been said (all of them with `all`), the
// first always; a step without a cue follows the one before it.
function reveal(frame = board.frame, all = false, now = false) {
  if (!frame?.steps) return;
  const heard = cue => new RegExp(`\\b${cue.trim().replace(/[.*+?^${}()|[\]\\]/g, '\\$&')}`, 'i').test(board.said);
  let upto = 0;
  frame.steps.forEach((step, i) => {
    const cues = (step.dataset.cue || '').split('|').filter(c => c.trim());
    if (all || cues.some(heard) || (!cues.length && upto === i - 1)) upto = i;
  });
  light(frame, upto, now);
}

// Lights steps up to `upto`, a beat apart (at once with `now`).
function light(frame, upto, now) {
  let delay = 0;
  for (const step of frame.steps.slice(0, upto + 1)) {
    if (step.dataset.shown) continue;
    step.dataset.shown = '1';
    setTimeout(() => step.classList.add('on'), delay);
    frame.lastStep = Date.now() + delay;
    if (!now) delay += 350;
  }
}

// Whether the voice has asked the question yet: its opening words or its last ones (it rewords numbers).
const plain = s => s.toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim();
const asked = q => { const w = plain(q).split(' '), said = plain(board.said); return said.includes(w.slice(0, 4).join(' ')) || said.includes(w.slice(-3).join(' ')); };

function ask(text) {
  $('question').firstChild.textContent = text;
  document.body.classList.add('asking');
}

// "set ..." changes the visual that's up: labels off and on here, anything else is the visual's own
// (its note says what it takes). With its labels off, each one comes back as the person names it.
function set(arg, frame = board.frame) {
  if (!frame) return;
  if (!frame.loaded) return frame.sets.push(arg);
  const doc = frame.contentDocument, labels = arg.trim().toLowerCase().match(/^labels\s+(on|off)$/)?.[1];
  if (labels) {
    doc.body.classList.toggle('labels-off', labels === 'off');
    doc.querySelectorAll('.label').forEach(l => l.classList.remove('named'));
    frame.heard = '';
  } else frame.contentWindow.postMessage({ set: arg }, '*');
}
function heard(text, frame = board.frame) {
  if (!frame?.loaded || !frame.contentDocument.body.classList.contains('labels-off')) return;
  frame.heard = (frame.heard || '') + text;
  for (const label of frame.contentDocument.querySelectorAll('.label[data-cue]:not(.named)'))
    if (label.dataset.cue.split('|').some(cue => new RegExp(`\\b${cue.trim().replace(/[.*+?^${}()|[\]\\]/g, '\\$&')}`, 'i').test(frame.heard))) label.classList.add('named');
}

function setTerm(text = '') {
  const [term, ...meaning] = text.split(': ');
  $('term').replaceChildren(...text ? [Object.assign(document.createElement('b'), { textContent: term }), meaning.join(': ')] : []);
  $('term').classList.toggle('on', !!text);
}

function clear() {
  setTerm();
  board.frame?.remove();
  Object.assign(board, { history: [], at: -1, frame: null, said: '', question: null });
  document.body.classList.remove('asking', 'visual');
  mark();
}

function onBoard(e) {
  if (e.type === 'clear') clear();
  if (e.type === 'visual') {
    board.history.push(e);
    board.at = board.history.length - 1;
    render(e, e.replay);
  }
  if (e.type === 'ask') {
    board.question = { text: e.question, at: Date.now(), heard: asked(e.question) };
    if (e.replay) ask(e.question);
  }
  if (e.type === 'turn') {
    reveal(board.frame, true);
    board.said = '';
    board.question = null;
    document.body.classList.remove('asking');
  }
  if (e.type === 'term') setTerm(e.term);
  if (e.type === 'cost') { spent = e.usd; $('cost').textContent = dollars(spent); }
  if (e.type === 'recap') recap(e);
  if (e.type === 'set') set(e.arg);
  if (e.type === 'heard') heard(e.text);
  if (e.type === 'said') {
    if (!board.said && board.frame) board.frame.lastStep = Date.now(); // the fallback counts from his first words, not from when the visual went up
    board.said += e.text;
    board.lastSaid = Date.now();
    if (board.question) board.question.heard ||= asked(board.question.text);
    reveal();
  }
  if (e.type === 'end') {
    board.frame?.classList.remove('shown');
    $('term').classList.remove('on');
    document.body.classList.remove('asking');
    setTimeout(clear, 600);
  }
  mark();
}

// Every few hundred ms: while he talks, a part he hasn't named comes up anyway, 8 s after the one before;
// once he has stopped, finish the board (4 s: the voice pauses up to about 2 s inside a turn) and write
// the question, as soon as he's asked it.
setInterval(() => {
  const pause = Date.now() - board.lastSaid, f = board.frame;
  document.body.classList.toggle('speaking', pause < 900);
  if (pause < 900 && f?.steps && Date.now() - f.lastStep > 8000) light(f, f.steps.findIndex(s => !s.dataset.shown), true);
  if (pause > 4000 && board.said) reveal(f, true);
  const q = board.question;
  if (q && !document.body.classList.contains('asking') && (q.heard ? pause > 1200 : pause > 4000 && Date.now() - q.at > 4000)) ask(q.text);
}, 300);

addEventListener('keydown', e => {
  const step = { ArrowLeft: -1, ArrowRight: 1 }[e.key];
  if (!step || !board.history.length) return;
  const at = Math.max(0, Math.min(board.history.length - 1, board.at + step));
  if (at === board.at) return;
  board.at = at;
  render(board.history[at], true);
  $('where').textContent = at === board.history.length - 1 ? 'now' : `${at + 1} of ${board.history.length}`;
  $('where').classList.add('on');
  clearTimeout($('where').timer);
  $('where').timer = setTimeout(() => $('where').classList.remove('on'), 1200);
});

// The board stream, while this page is in view: the mind only uses the board when the person can see it.
let following = null, looping = false;
async function follow() {
  if (looping) return;
  looping = true;
  while (document.visibilityState === 'visible') {
    following = new AbortController();
    try {
      const res = await fetch('/api/board', { signal: following.signal });
      if (!res.ok) throw new Error(res.status);
      clear(); // the server replays what's up now: start from that, not from what this page last saw
      const reader = res.body.pipeThrough(new TextDecoderStream()).getReader();
      let buffer = '';
      for (;;) {
        const { value, done } = await reader.read();
        if (done) break;
        buffer += value;
        const lines = buffer.split('\n');
        buffer = lines.pop();
        for (const line of lines) if (line.trim()) onBoard(JSON.parse(line));
      }
    } catch {}
    following = null;
    await new Promise(r => setTimeout(r, 2000));
  }
  looping = false;
}
document.addEventListener('visibilitychange', () => document.visibilityState === 'visible' ? follow() : following?.abort());
follow();
loadSpace();
</script>
</body>
</html>
